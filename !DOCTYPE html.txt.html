<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kids Birthday Calendar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #fdfbfb, #ebedee);
      color: #222;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    .balloon-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .balloon {
      position: absolute;
      bottom: -150px;
      width: 70px;
      height: 90px;
      border-radius: 50% 50% 45% 45%;
      opacity: 0.18;
      animation: floatUp linear infinite;
    }

    .balloon::before {
      content: "";
      position: absolute;
      bottom: -35px;
      left: 50%;
      width: 2px;
      height: 35px;
      background: rgba(0, 0, 0, 0.15);
      transform: translateX(-50%);
    }

    .balloon::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 50%;
      width: 10px;
      height: 10px;
      background: inherit;
      transform: translateX(-50%) rotate(45deg);
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.18;
      }
      100% {
        transform: translateY(-120vh) translateX(30px);
        opacity: 0;
      }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1450px;
      margin: 0 auto;
      padding: 30px 20px 50px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(10px);
      border-radius: 26px;
      padding: 30px 20px;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.08);
    }

    .header h1 {
      font-size: clamp(2rem, 4vw, 3.2rem);
      color: #222;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 1.05rem;
      color: #666;
      margin-bottom: 18px;
    }

    .header .emoji {
      font-size: 1.8rem;
      margin: 0 6px;
    }

    .search-wrap {
      max-width: 550px;
      margin: 0 auto;
    }

    .search-box {
      width: 100%;
      padding: 14px 18px;
      border-radius: 16px;
      border: 1px solid #dcdcdc;
      outline: none;
      font-size: 1rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
      transition: 0.2s ease;
    }

    .search-box:focus {
      border-color: #7a5cff;
      box-shadow: 0 8px 20px rgba(122, 92, 255, 0.15);
    }

    .top-panels {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-bottom: 28px;
    }

    .next-birthday-card {
      background: linear-gradient(135deg, #7a5cff, #5b8cff);
      color: white;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 14px 30px rgba(91, 140, 255, 0.25);
      position: relative;
      overflow: hidden;
    }

    .next-birthday-card::before {
      content: "🎉";
      position: absolute;
      right: 22px;
      top: 18px;
      font-size: 3rem;
      opacity: 0.15;
    }

    .next-birthday-label {
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      opacity: 0.9;
      margin-bottom: 8px;
    }

    .next-birthday-name {
      font-size: clamp(1.6rem, 3vw, 2.4rem);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .next-birthday-date {
      font-size: 1.1rem;
      margin-bottom: 8px;
    }

    .next-birthday-countdown {
      display: inline-block;
      margin-top: 6px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      font-weight: 600;
      backdrop-filter: blur(6px);
    }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 22px;
    }

    .month-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    .month-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 30px rgba(0, 0, 0, 0.12);
    }

    .month-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 14px;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 2px solid #f1f1f1;
      padding-bottom: 10px;
    }

    .birthday-count {
      font-size: 0.85rem;
      background: linear-gradient(135deg, #ff7eb3, #ff758c);
      color: white;
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 600;
      white-space: nowrap;
    }

    .birthday-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .birthday-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 16px;
      background: linear-gradient(135deg, #f9fbff, #eef4ff);
      border: 1px solid #e8eef8;
      gap: 12px;
    }

    .birthday-name {
      font-weight: 600;
      color: #222;
      line-height: 1.3;
    }

    .birthday-date {
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: white;
      padding: 8px 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      min-width: 65px;
      text-align: center;
      box-shadow: 0 6px 14px rgba(37, 117, 252, 0.22);
    }

    .empty-month {
      text-align: center;
      color: #888;
      padding: 20px 10px;
      font-style: italic;
    }

    .no-search-results {
      display: none;
      text-align: center;
      margin-top: 30px;
      padding: 18px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.06);
      color: #666;
      font-weight: 600;
    }

    .footer {
      text-align: center;
      margin-top: 35px;
      color: #666;
      font-size: 0.95rem;
    }

    @media (max-width: 700px) {
      .container {
        padding: 18px 14px 35px;
      }

      .header {
        padding: 24px 14px;
        border-radius: 20px;
      }

      .next-birthday-card {
        padding: 20px;
        border-radius: 20px;
      }

      .month-card {
        padding: 16px;
        border-radius: 20px;
      }

      .birthday-item {
        flex-direction: row;
        align-items: center;
      }

      .birthday-name {
        font-size: 0.95rem;
      }

      .birthday-date {
        font-size: 0.85rem;
        padding: 7px 10px;
      }

      .month-title {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <div class="balloon-bg" id="balloonBg"></div>

  <div class="container">
    <div class="header">
      <h1><span class="emoji">🎈</span> Kids Birthday Calendar <span class="emoji">🎉</span></h1>
      <p>Search for a child and see the next upcoming birthday at a glance</p>

      <div class="search-wrap">
        <input
          type="text"
          id="searchInput"
          class="search-box"
          placeholder="Search by name..."
        />
      </div>
    </div>

    <div class="top-panels">
      <div class="next-birthday-card" id="nextBirthdayCard">
        <div class="next-birthday-label">Next Birthday</div>
        <div class="next-birthday-name" id="nextBirthdayName">Loading...</div>
        <div class="next-birthday-date" id="nextBirthdayDate"></div>
        <div class="next-birthday-countdown" id="nextBirthdayCountdown"></div>
      </div>
    </div>

    <div class="month-grid" id="calendar"></div>
    <div class="no-search-results" id="noResults">No birthdays found for that search.</div>

    <div class="footer">
      Made with balloons, birthdays and a bit of JavaScript 🎂
    </div>
  </div>

  <script>
    const birthdayData = [
      {
        month: "January",
        birthdays: [
          { day: "14th", name: "Emily Glen" },
          { day: "31st", name: "Scarlett Norton" }
        ]
      },
      {
        month: "February",
        birthdays: [
          { day: "4th", name: "Eryn Jones" }
        ]
      },
      {
        month: "March",
        birthdays: [
          { day: "2nd", name: "Charlie Milward" },
          { day: "6th", name: "Tyler Milward" }
        ]
      },
      {
        month: "April",
        birthdays: [
          { day: "14th", name: "Clay Williamson" }
        ]
      },
      {
        month: "May",
        birthdays: [
          { day: "4th", name: "Connor Worthington" },
          { day: "23rd", name: "Jaxon Milward" }
        ]
      },
      {
        month: "June",
        birthdays: [
          { day: "9th", name: "Tabby Tague" }
        ]
      },
      {
        month: "July",
        birthdays: [
          { day: "15th", name: "Matthew Rivers" }
        ]
      },
      {
        month: "August",
        birthdays: [
          { day: "2nd", name: "Jessica Norton" },
          { day: "5th", name: "Isabella Tidmarsh" },
          { day: "6th", name: "Sophie Slater" }
        ]
      },
      {
        month: "September",
        birthdays: []
      },
      {
        month: "October",
        birthdays: [
          { day: "11th", name: "Lily Tague" }
        ]
      },
      {
        month: "November",
        birthdays: [
          { day: "1st", name: "Isla Glen" },
          { day: "19th", name: "Emily Jones" }
        ]
      },
      {
        month: "December",
        birthdays: [
          { day: "8th", name: "Sam Rivers" }
        ]
      }
    ];

    const monthNames = [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ];

    const calendar = document.getElementById("calendar");
    const searchInput = document.getElementById("searchInput");
    const noResults = document.getElementById("noResults");

    function renderCalendar() {
      calendar.innerHTML = "";

      birthdayData.forEach(monthData => {
        const card = document.createElement("div");
        card.className = "month-card";
        card.setAttribute("data-month", monthData.month.toLowerCase());

        const title = document.createElement("div");
        title.className = "month-title";
        title.innerHTML = `
          <span>${monthData.month}</span>
          <span class="birthday-count">${monthData.birthdays.length} ${monthData.birthdays.length === 1 ? "Birthday" : "Birthdays"}</span>
        `;

        card.appendChild(title);

        if (monthData.birthdays.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty-month";
          empty.textContent = "No birthdays this month";
          card.appendChild(empty);
        } else {
          const list = document.createElement("ul");
          list.className = "birthday-list";

          monthData.birthdays.forEach(item => {
            const li = document.createElement("li");
            li.className = "birthday-item";
            li.setAttribute("data-name", item.name.toLowerCase());
            li.innerHTML = `
              <span class="birthday-name">🎂 ${item.name}</span>
              <span class="birthday-date">${item.day}</span>
            `;
            list.appendChild(li);
          });

          card.appendChild(list);
        }

        calendar.appendChild(card);
      });
    }

    function getDayNumber(dayText) {
      return parseInt(dayText.replace(/\D/g, ""), 10);
    }

    function getNextBirthday() {
      const allBirthdays = [];

      birthdayData.forEach((monthData, monthIndex) => {
        monthData.birthdays.forEach(person => {
          allBirthdays.push({
            name: person.name,
            dayText: person.day,
            day: getDayNumber(person.day),
            month: monthData.month,
            monthIndex: monthIndex
          });
        });
      });

      const today = new Date();
      const todayMidnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());

      const upcoming = allBirthdays.map(person => {
        let nextDate = new Date(today.getFullYear(), person.monthIndex, person.day);

        if (nextDate < todayMidnight) {
          nextDate = new Date(today.getFullYear() + 1, person.monthIndex, person.day);
        }

        const diffTime = nextDate - todayMidnight;
        const daysAway = Math.round(diffTime / (1000 * 60 * 60 * 24));

        return {
          ...person,
          nextDate,
          daysAway
        };
      });

      upcoming.sort((a, b) => a.nextDate - b.nextDate);
      return upcoming[0];
    }

    function formatDate(dateObj) {
      const day = dateObj.getDate();
      const month = monthNames[dateObj.getMonth()];
      return `${day}${getOrdinal(day)} ${month} ${dateObj.getFullYear()}`;
    }

    function getOrdinal(day) {
      if (day > 3 && day < 21) return "th";
      switch (day % 10) {
        case 1: return "st";
        case 2: return "nd";
        case 3: return "rd";
        default: return "th";
      }
    }

    function updateNextBirthdayCard() {
      const nextBirthday = getNextBirthday();

      const nameEl = document.getElementById("nextBirthdayName");
      const dateEl = document.getElementById("nextBirthdayDate");
      const countdownEl = document.getElementById("nextBirthdayCountdown");

      nameEl.textContent = nextBirthday.name;
      dateEl.textContent = `🎂 ${nextBirthday.dayText} ${nextBirthday.month}`;

      if (nextBirthday.daysAway === 0) {
        countdownEl.textContent = "It’s today!";
      } else if (nextBirthday.daysAway === 1) {
        countdownEl.textContent = "1 day to go";
      } else {
        countdownEl.textContent = `${nextBirthday.daysAway} days to go`;
      }
    }

    function filterBirthdays() {
      const searchTerm = searchInput.value.trim().toLowerCase();
      const monthCards = document.querySelectorAll(".month-card");
      let anyVisible = false;

      monthCards.forEach(card => {
        const birthdayItems = card.querySelectorAll(".birthday-item");
        const emptyMonth = card.querySelector(".empty-month");

        if (birthdayItems.length === 0) {
          if (searchTerm === "") {
            card.style.display = "";
            anyVisible = true;
          } else {
            card.style.display = "none";
          }
          return;
        }

        let visibleItems = 0;

        birthdayItems.forEach(item => {
          const name = item.getAttribute("data-name");
          if (name.includes(searchTerm)) {
            item.style.display = "flex";
            visibleItems++;
          } else {
            item.style.display = "none";
          }
        });

        if (visibleItems > 0) {
          card.style.display = "";
          anyVisible = true;
        } else {
          card.style.display = "none";
        }

        if (emptyMonth) {
          emptyMonth.style.display = searchTerm === "" ? "" : "none";
        }
      });

      noResults.style.display = anyVisible ? "none" : "block";
    }

    function createBalloons() {
      const balloonBg = document.getElementById("balloonBg");
      const balloonColors = [
        "#ff6b6b",
        "#ffd93d",
        "#6bcB77",
        "#4d96ff",
        "#c77dff",
        "#ff8fab"
      ];

      for (let i = 0; i < 18; i++) {
        const balloon = document.createElement("div");
        balloon.className = "balloon";

        const size = Math.random() * 35 + 45;
        balloon.style.width = size + "px";
        balloon.style.height = size * 1.25 + "px";
        balloon.style.left = Math.random() * 100 + "vw";
        balloon.style.animationDuration = (Math.random() * 12 + 12) + "s";
        balloon.style.animationDelay = Math.random() * 6 + "s";
        balloon.style.background = balloonColors[Math.floor(Math.random() * balloonColors.length)];

        balloonBg.appendChild(balloon);
      }
    }

    renderCalendar();
    updateNextBirthdayCard();
    createBalloons();

    searchInput.addEventListener("input", filterBirthdays);
  </script>
</body>
</html>
``
