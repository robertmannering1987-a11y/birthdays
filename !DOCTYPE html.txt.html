<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kids Birthday Calendar</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa, #e4ecf7);
      margin: 0;
    }

    h1 {
      text-align: center;
      margin-top: 20px;
    }

    .search-box {
      display: block;
      margin: 20px auto;
      padding: 12px;
      width: 300px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    .next {
      margin: 20px;
      padding: 20px;
      background: #5b8cff;
      color: white;
      border-radius: 15px;
      text-align: center;
      font-size: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .month {
      background: white;
      border-radius: 15px;
      padding: 15px;
    }

    .birthday {
      display: flex;
      justify-content: space-between;
      padding: 8px;
      background: #eef4ff;
      margin-top: 8px;
      border-radius: 8px;
    }

    .balloon {
      position: fixed;
      bottom: -100px;
      width: 50px;
      height: 70px;
      border-radius: 50%;
      opacity: 0.2;
      animation: float 15s infinite;
    }

    @keyframes float {
      from { transform: translateY(0); }
      to { transform: translateY(-120vh); }
    }
  </style>
</head>

<body>

<h1>🎈 Kids Birthday Calendar 🎉</h1>

<input type="text" id="search" class="search-box" placeholder="Search name...">

<div class="next" id="nextBirthday">Loading next birthday...</div>

<div class="grid" id="calendar"></div>

<script>
const data = [
  { month: "January", birthdays: [{ day: "14th", name: "Emily" },{ day: "31st", name: "Scarlett" }]},
  { month: "February", birthdays: [{ day: "4th", name: "Eryn" }]},
  { month: "March", birthdays: [{ day: "2nd", name: "Charlie" },{ day: "6th", name: "Tyler" }]},
  { month: "April", birthdays: [{ day: "14th", name: "Clay" }]},
  { month: "May", birthdays: [{ day: "4th", name: "Connor" },{ day: "23rd", name: "Jaxon" }]},
  { month: "June", birthdays: [{ day: "9th", name: "Tabby" }]},
  { month: "July", birthdays: [{ day: "15th", name: "Matthew" }]},
  { month: "August", birthdays: [{ day: "2nd", name: "Jessica" },{ day: "5th", name: "Isabella" },{ day: "6th", name: "Sophie" }]},
  { month: "September", birthdays: []},
  { month: "October", birthdays: [{ day: "11th", name: "Lily" }]},
  { month: "November", birthdays: [{ day: "1st", name: "Isla" },{ day: "19th", name: "Emily" }]},
  { month: "December", birthdays: [{ day: "8th", name: "Sam" }]}
];

const calendar = document.getElementById("calendar");

function render() {
  calendar.innerHTML = "";

  data.forEach(m => {
    const card = document.createElement("div");
    card.className = "month";

    card.innerHTML = `<h3>${m.month}</h3>`;

    if (m.birthdays.length === 0) {
      card.innerHTML += `<p>No birthdays</p>`;
    } else {
      m.birthdays.forEach(b => {
        const row = document.createElement("div");
        row.className = "birthday";
        row.dataset.name = b.name.toLowerCase();

        row.innerHTML = `<span>🎂 ${b.name}</span><span>${b.day}</span>`;
        card.appendChild(row);
      });
    }

    calendar.appendChild(card);
  });
}

function nextBirthday() {
  let today = new Date();
  let year = today.getFullYear();
  let list = [];

  data.forEach((m, i) => {
    m.birthdays.forEach(b => {
      let day = parseInt(b.day);
      let date = new Date(year, i, day);

      if (date < today) {
        date = new Date(year + 1, i, day);
      }

      list.push({ name: b.name, date: date, text: b.day + " " + m.month });
    });
  });

  list.sort((a, b) => a.date - b.date);

  let next = list[0];
  let diff = Math.ceil((next.date - today) / (1000 * 60 * 60 * 24));

  document.getElementById("nextBirthday").innerHTML =
    `🎉 Next Birthday: <b>${next.name}</b><br>${next.text} (${diff} days)`;
}

document.getElementById("search").addEventListener("input", function() {
  let val = this.value.toLowerCase();

  document.querySelectorAll(".birthday").forEach(el => {
    el.style.display = el.dataset.name.includes(val) ? "flex" : "none";
  });
});

function balloons() {
  const colours = ["red","blue","yellow","green","purple","pink"];

  for (let i = 0; i < 12; i++) {
    let b = document.createElement("div");
    b.className = "balloon";
    b.style.left = Math.random()*100 + "vw";
    b.style.background = colours[Math.floor(Math.random()*colours.length)];
    b.style.animationDuration = (10 + Math.random()*10) + "s";
    document.body.appendChild(b);
  }
}

render();
nextBirthday();
balloons();
</script>

</body>
</html>
